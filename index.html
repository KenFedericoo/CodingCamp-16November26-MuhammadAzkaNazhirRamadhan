<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER / GREETING ===== -->
  <header class="header">
    <div class="header-top">
      <div id="datetime" class="datetime"></div>
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle dark/light mode">🌙</button>
    </div>
    <h1 id="greeting" class="greeting"></h1>

    <!-- Challenge: Custom name -->
    <div class="name-row">
      <span id="name-display" class="name-display"></span>
      <button id="edit-name-btn" class="btn-text" aria-label="Edit name">✏️ Edit Name</button>
    </div>
    <div id="name-editor" class="name-editor hidden">
      <input type="text" id="name-input" class="input" placeholder="Enter your name…" maxlength="30" />
      <button id="save-name-btn" class="btn btn-primary">Save</button>
    </div>
  </header>

  <main class="main">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card" id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="card-title">🍅 Focus Timer</h2>

      <!-- Challenge: Change Pomodoro time -->
      <div class="timer-settings">
        <label for="timer-duration">Duration (min):</label>
        <input type="number" id="timer-duration" class="input input-sm" min="1" max="120" value="25" />
        <button id="apply-duration-btn" class="btn btn-secondary btn-sm">Apply</button>
      </div>

      <div class="timer-display" aria-live="polite">
        <span id="timer-time">25:00</span>
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-stop" class="btn btn-secondary" disabled>⏸ Stop</button>
        <button id="timer-reset" class="btn btn-outline">↺ Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card" id="todo-section" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="card-title">✅ To-Do List</h2>
      <div class="todo-add-row">
        <input type="text" id="todo-input" class="input" placeholder="Add a new task…" maxlength="100" aria-label="New task" />
        <button id="todo-add-btn" class="btn btn-primary">Add</button>
      </div>

      <!-- Challenge: Sort tasks -->
      <div class="todo-toolbar">
        <span class="label">Sort:</span>
        <button id="sort-all-btn" class="btn btn-sm sort-btn active" data-sort="all">All</button>
        <button id="sort-active-btn" class="btn btn-sm sort-btn" data-sort="active">Active</button>
        <button id="sort-done-btn" class="btn btn-sm sort-btn" data-sort="done">Done</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      <p id="todo-empty" class="empty-hint hidden">No tasks yet. Add one above!</p>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card" id="links-section" aria-labelledby="links-heading">
      <h2 id="links-heading" class="card-title">🔗 Quick Links</h2>
      <div class="links-add-row">
        <input type="text" id="link-name-input" class="input" placeholder="Name (e.g. YouTube)" maxlength="30" aria-label="Link name" />
        <input type="url" id="link-url-input" class="input" placeholder="https://…" maxlength="200" aria-label="Link URL" />
        <button id="link-add-btn" class="btn btn-primary">Add</button>
      </div>
      <div id="links-grid" class="links-grid"></div>
      <p id="links-empty" class="empty-hint hidden">No links yet. Add your favorites!</p>
    </section>

  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="edit-task-input" class="input" maxlength="100" aria-label="Edit task text" />
      <div class="modal-actions">
        <button id="modal-save-btn" class="btn btn-primary">Save</button>
        <button id="modal-cancel-btn" class="btn btn-outline">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
